# Statik export sunucusu. TLS'i ve alan adını Coolify'ın Traefik'i yönetir; burası düz HTTP :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Next.js statik export: /yol → /yol.html ya da /yol/index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # İçerik-hash'li dosyalar sonsuza kadar önbelleklenebilir
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location içinde add_header varsa üst seviyedekiler MİRAS ALINMAZ (nginx kuralı) → tekrar
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
