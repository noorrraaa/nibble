# Statik export sunucusu. TLS'i ve alan adını Coolify'ın Traefik'i yönetir; burası düz HTTP :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Next.js statik export: /yol → /yol.html ya da /yol/index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # İçerik-hash'li dosyalar sonsuza kadar önbelleklenebilir
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location içinde add_header varsa üst seviyedekiler MİRAS ALINMAZ (nginx kuralı) → tekrar
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Web uygulaması manifesti: nginx 1.27 mime.types'ta .webmanifest yok (octet-stream olurdu).
    # Burada add_header yok, yani server seviyesindeki güvenlik başlıkları miras alınıyor.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    error_page 404 /404.html;

    # llms.txt / robots.txt "Emre Kızak" gibi UTF-8 içeriyor; charset yoksa (nosniff ile)
    # tarayıcı Windows-1252 sanıp bozuk gösterebiliyor.
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
