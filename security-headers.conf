# Güvenlik başlıkları: TEK KAYNAK. nginx.conf bunu hem server seviyesinde hem de kendi
# add_header'ı olan her location'da `include` ediyor (location içinde add_header varsa
# üst seviyedekiler miras alınmaz; elle tekrar yazmak birini unutmaya açık).
# HSTS yok: TLS'i Traefik sonlandırıyor, .app zaten HSTS ön yükleme listesinde.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# CSP, nibble'a özel notlar:
#  - script-src 'unsafe-inline': Next statik export'u sayfa verisini satır içi <script> ile
#    basıyor ve layout'taki tema betiği de satır içi; içerik her derlemede değişiyor.
#    'unsafe-eval' YOK: ajan kodu tarayıcı eklentisi/DevTools üzerinden çalışıyor, sayfa
#    CSP'si onu engellemiyor; sayfanın kendisi eval kullanmıyor.
#  - img-src https:: ajan "files" izniyle importImage("https://...") yapabiliyor
#    (agent-policy.ts classifyImageSource). data:/blob: kullanıcının kendi dosyası/dışa aktarımı.
#  - connect-src 'self' https:: sayfa bugün hiçbir yere fetch atmıyor (legal.test.ts
#    kilitliyor); kullanıcının sayfada çalışan kendi ajanı kendi https uç noktasına
#    bağlanabilsin diye açık. Yerel (http://localhost) ajan desteği kodda YOK, o yüzden
#    http: izni verilmedi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
